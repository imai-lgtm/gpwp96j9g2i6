<body>
<div id="app">

    <div id="layer"></div>
    <div id="wipe"></div>
    <button id="btnSound" class="iconbtn" aria-label="音"><span class="ic-sound"></span></button>
    <div id="boot"><img src="img/logo_mark.svg" alt=""><p>読み込み中…</p></div>
